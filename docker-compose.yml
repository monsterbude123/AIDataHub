# =============================================================================
# AI DataHub Docker Compose - Development Infrastructure
# =============================================================================
# This file starts all required infrastructure services (PostgreSQL, Redis, etc.)
# Application services run locally on your machine for development.
#
# Usage:
#   docker-compose up -d           # Start all infrastructure
#   docker-compose down            # Stop all infrastructure
#   docker-compose logs -f postgres  # View PostgreSQL logs
#
# For full production deployment, see:
#   doc/plans/2026-04-02-docker-deployment-design.md
# =============================================================================

version: '3.8'

services:
  # PostgreSQL - primary relational database for all services
  postgres:
    image: postgres:16-alpine
    container_name: aidatahub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aidatahub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aidatahub"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis - for caching, rate limiting, session storage
  redis:
    image: redis:7-alpine
    container_name: aidatahub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aidatahub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: apply Prisma migrations to local PostgreSQL
  db-migrate:
    image: node:20-alpine
    container_name: aidatahub-db-migrate
    working_dir: /workspace
    command: sh -c "npm ci && npm -w @ai-datahub/database run db:migrate:deploy && npm -w @ai-datahub/database run db:generate"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aidatahub?schema=public
      APP_ENV: dev
      DATABASE_URL_DEV: postgresql://postgres:postgres@postgres:5432/aidatahub?schema=public
      DATABASE_URL_STAGE: postgresql://postgres:postgres@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://postgres:postgres@postgres:5432/aidatahub?schema=public
    volumes:
      - ./:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  postgres-data:
  redis-data:
