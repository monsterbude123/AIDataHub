# =============================================================================
# AI DataHub Production Docker Compose
# =============================================================================
# 一键启动所有服务：
#   docker-compose up -d
#
# 查看服务状态：
#   docker-compose ps
#
# 查看日志：
#   docker-compose logs -f
#
# 停止服务：
#   docker-compose down
#
# 完全清理（包括数据）：
#   docker-compose down -v
# =============================================================================

version: '3.8'

# -----------------------------------------------------------------------------
# 网络配置
# -----------------------------------------------------------------------------
networks:
  aidatahub-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# -----------------------------------------------------------------------------
# 数据卷
# -----------------------------------------------------------------------------
volumes:
  postgres-data:
  redis-data:
  minio-data:

# -----------------------------------------------------------------------------
# 服务配置
# -----------------------------------------------------------------------------
services:
  # ===========================================================================
  # 基础设施服务
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: aidatahub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - aidatahub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aidatahub}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: aidatahub-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - aidatahub-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: aidatahub-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - aidatahub-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aidatahub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - aidatahub-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===========================================================================
  # 应用服务 - 基础设施层
  # ===========================================================================

  auth-service:
    build:
      context: .
      dockerfile: services/system-auth-service/Dockerfile
    container_name: aidatahub-auth
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_BACKEND: redis
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      EVENT_BUS_BACKEND: rabbitmq
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-at-least-32-chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - "4001:4001"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  db-migrate:
    image: node:20-alpine
    container_name: aidatahub-db-migrate
    working_dir: /workspace
    command: sh -c "npm ci && npm -w @ai-datahub/database run db:migrate:deploy && npm -w @ai-datahub/database run db:generate"
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
    volumes:
      - ./:/workspace
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  metadata-service:
    build:
      context: .
      dockerfile: services/metadata-service/Dockerfile
    container_name: aidatahub-metadata
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 4002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_BACKEND: redis
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "4002:4002"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  data-service:
    build:
      context: .
      dockerfile: services/data-service-service/Dockerfile
    container_name: aidatahub-data
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 4003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "4003:4003"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  task-scheduler:
    build:
      context: .
      dockerfile: services/task-scheduler-service/Dockerfile
    container_name: aidatahub-tasks
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5001:5001"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # 应用服务 - 业务能力层
  # ===========================================================================

  ops-service:
    build:
      context: .
      dockerfile: services/ops-service/Dockerfile
    container_name: aidatahub-ops
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_BACKEND: redis
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      EVENT_BUS_BACKEND: rabbitmq
      AUTH_SERVICE_URL: http://auth-service:4001
      METADATA_SERVICE_URL: http://metadata-service:4002
    ports:
      - "3001:3001"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  integration-service:
    build:
      context: .
      dockerfile: services/integration-service/Dockerfile
    container_name: aidatahub-integration
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_ENV: prod
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      DATABASE_URL_DEV: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_dev?schema=public
      DATABASE_URL_STAGE: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/aidatahub_stage?schema=public
      DATABASE_URL_PROD: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_BACKEND: redis
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      EVENT_BUS_BACKEND: rabbitmq
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "3002:3002"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: aidatahub-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001
    ports:
      - "3003:3003"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  sharing-service:
    build:
      context: .
      dockerfile: services/sharing-service/Dockerfile
    container_name: aidatahub-sharing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001
      OPS_SERVICE_URL: http://ops-service:3001
    ports:
      - "3004:3004"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      ops-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    container_name: aidatahub-analytics
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001
      METADATA_SERVICE_URL: http://metadata-service:4002
      DATA_SERVICE_URL: http://data-service:4003
    ports:
      - "3005:3005"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  security-service:
    build:
      context: .
      dockerfile: services/security-service/Dockerfile
    container_name: aidatahub-security
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-aidatahub}?schema=public
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-aidatahub}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AUTH_SERVICE_URL: http://auth-service:4001
      DATA_SERVICE_URL: http://data-service:4003
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-chars-minimum}
    ports:
      - "3006:3006"
    networks:
      - aidatahub-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # API Gateway - 统一入口
  # ===========================================================================

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: aidatahub-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:4001
      METADATA_SERVICE_URL: http://metadata-service:4002
      DATA_SERVICE_URL: http://data-service:4003
      OPS_SERVICE_URL: http://ops-service:3001
      INTEGRATION_SERVICE_URL: http://integration-service:3002
      ADMIN_SERVICE_URL: http://admin-service:3003
      SHARING_SERVICE_URL: http://sharing-service:3004
      ANALYTICS_SERVICE_URL: http://analytics-service:3005
      SECURITY_SERVICE_URL: http://security-service:3006
      TASK_SERVICE_URL: http://task-scheduler:5001
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    networks:
      - aidatahub-network
    depends_on:
      auth-service:
        condition: service_healthy
      metadata-service:
        condition: service_healthy
      data-service:
        condition: service_healthy
      task-scheduler:
        condition: service_healthy
      ops-service:
        condition: service_healthy
      integration-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      sharing-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      security-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s